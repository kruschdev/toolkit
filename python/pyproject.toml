[project]
name = "krusch-toolkit"
version = "1.6.0"
description = "Shared Python Lego bricks for AI & backend services — FastAPI, MCP, PostgreSQL/pgvector, SQLAlchemy WAL/Async Pool, Safe YAML Packs, Security/SSRF/Webhooks, HTTP Resilience, Streamlit RAG UI, Schema, Upload/MIME, Flask, LLM, embeddings, Raw-RAG, config, DB, logging, auth"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "kruschdev", email = "kruschdev@users.noreply.github.com"}]
dependencies = [
    "python-dotenv>=0.19.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "google-genai>=1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "flask>=3.0.0",
    "flask-login>=0.6.0",
    "flask-limiter>=3.0.0",
    "bcrypt>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/kruschdev/toolkit"
Repository = "https://github.com/kruschdev/toolkit"

[project.optional-dependencies]
fastapi = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "pydantic>=2.6.0"]
streamlit = ["streamlit>=1.32.0"]
sentry = ["sentry-sdk[flask]>=1.0.0"]
dev = ["pytest>=7.0.0", "ruff>=0.1.0", "fastapi>=0.110.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["krusch_toolkit*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
