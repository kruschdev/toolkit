name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-toolkit:
    name: Node.js 22 (@krusch/toolkit v1.8.0 & Zero-Leak Gate)
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Enforce INV-LEGO-26 Zero-Leak Security Gate
        run: node ./scripts/verify-zero-leaks.js --strict-release
      - name: Verify krusch-lego CLI catalog
        run: node ./bin/krusch-lego.js list --json > /dev/null
      - name: Run Node.js & TypeScript (.d.ts) test suites
        run: npm test

  python-toolkit:
    name: Python ${{ matrix.python-version }} (krusch_toolkit v1.6.0)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install krusch_toolkit & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./python[dev,fastapi,streamlit]"
      - name: Enforce INV-LEGO-26 Zero-Leak Gate on Python package
        run: |
          node ./scripts/verify-zero-leaks.js ./python
          python -c "import krusch_toolkit; assert krusch_toolkit.__version__ == '1.6.0'"
      - name: Run pytest suite
        run: pytest python/tests -q
